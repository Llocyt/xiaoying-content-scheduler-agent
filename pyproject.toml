[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoying-content-scheduler-agent"
version = "0.1.0"
description = "Bounded model-driven content review and draft scheduling CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-scheduler = "scheduler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
